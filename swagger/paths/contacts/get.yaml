tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: 'Get contacts'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: string
      example: '1'
  - in: query
    name: perPage
    required: false
    schema:
      type: string
      example: '5'
  - in: query
    name: sortBy
    required: false
    schema:
      type: string
      example: '_id'
      enum: [_id, name, phoneNumber, email, isFavorite, contactType]
  - in: query
    name: sortOrder
    required: false
    schema:
      type: string
      example: 'asc'
      enum: [asc, desc]
  - in: query
    name: filter
    required: false
    schema:
      type: string
      example: 'isFavorite'
      enum: [isFavorite, contactType]
responses:
  '200':
    description: 'Successfully found contacts!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 4
                totalItems:
                  type: number
                  example: 4
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401.yaml'

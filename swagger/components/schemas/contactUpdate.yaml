type: object
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  userId:
    description: "User's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name. Length should be between 3 and 20"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: +377755588333
  email:
    description: "Contact's email. Length should be between 3 and 30"
    type: number
    pattern: /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    example: JohnDoe@gmail.com
  isFavourite:
    description: 'Whether the contact is a favorite.'
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    example: work
    enum: ['work', 'home', 'personal']
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
